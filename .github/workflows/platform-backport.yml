# Self-contained tao-community workflow (see tao-community/README.md).

name: Platform backport release

on:
  workflow_dispatch:
    inputs:
      source_release:
        description: >
          Monthly platform line (YYYY.MM). Latest tag on that line is the branch point.
        required: true
        type: string
      extensions:
        description: >
          package=version and/or GitHub release URLs. Separate with commas or |
          (e.g. oat-sa/tao-core=56.7.3).
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: platform-backport-${{ inputs.source_release }}-${{ github.repository }}
  cancel-in-progress: false

env:
  PLATFORM_MAIN_BRANCH: master
  PLATFORM_TAG_PREFIX: ''
  BOT_USER_NAME: oat-github-bot
  BOT_USER_EMAIL: oat-github-bot@taotesting.com

jobs:
  backport:
    name: Create backport release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.backport_version }}
      release_url: ${{ steps.publish.outputs.release_url }}
      package_updates: ${{ steps.updates.outputs.package_updates }}
    steps:
      - name: Checkout platform (caller)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve GitHub token for this repository
        id: auth
        uses: ./.github/actions/resolve-github-token
        with:
          elevated-token: ${{ secrets.SEMVER_GH_TOKEN }}
          fallback-token: ${{ github.token }}


      - name: Load bundled platform-release tooling
        id: tooling
        uses: ./.github/actions/platform-release-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Composer cache
        uses: ./.github/actions/cache-composer

      - name: Setup Composer
        uses: ./.github/actions/setup-composer
        with:
          php-version: '8.3'
          github-token: ${{ steps.auth.outputs.packages-token }}

      - name: Validate source and calculate next backport
        id: meta
        env:
          SOURCE_INPUT: ${{ inputs.source_release }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          node "$SCRIPTS/validate.mjs" --check=platform-version --version="$SOURCE_INPUT"

          git tag -l > /tmp/tags.txt
          node "$SCRIPTS/calculate-next-backport.mjs" \
            --source-release="$SOURCE_INPUT" \
            --tags-file=/tmp/tags.txt

          SOURCE_RELEASE=$(grep '^source_release=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          BACKPORT_VERSION=$(grep '^backport_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          BACKPORT_BRANCH=$(grep '^backport_branch=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)

          if ! git rev-parse -q --verify "refs/tags/${SOURCE_RELEASE}" >/dev/null; then
            echo "::error::Resolved source release does not exist as a git tag: ${SOURCE_RELEASE}"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${BACKPORT_VERSION}" >/dev/null; then
            echo "::error::Backport tag already exists: ${BACKPORT_VERSION}"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/${BACKPORT_BRANCH}" \
            || git show-ref --verify --quiet "refs/heads/${BACKPORT_BRANCH}"; then
            echo "::error::Backport branch already exists: ${BACKPORT_BRANCH}"
            exit 1
          fi

          echo "Creating ${BACKPORT_BRANCH} / ${BACKPORT_VERSION} from ${SOURCE_RELEASE} (input ${SOURCE_INPUT})"

      - name: Create backport branch from source tag
        env:
          SOURCE_RELEASE: ${{ steps.meta.outputs.source_release }}
          BACKPORT_BRANCH: ${{ steps.meta.outputs.backport_branch }}
        run: |
          set -euo pipefail
          git checkout -b "$BACKPORT_BRANCH" "$SOURCE_RELEASE"

      - name: Apply requested package updates
        id: deps
        env:
          EXTENSIONS: ${{ inputs.extensions }}
          SOURCE_MONTHLY: ${{ steps.meta.outputs.monthly_base }}
          GH_TOKEN: ${{ steps.auth.outputs.packages-token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXTENSIONS" > /tmp/updates.txt

          node "$SCRIPTS/resolve-backport-updates.mjs" \
            --composer-json=composer.json \
            --source-monthly="$SOURCE_MONTHLY" \
            --updates-file=/tmp/updates.txt \
            --output=/tmp/changes.json \
            --composer-updates-file=/tmp/composer-updates.txt \
            --transient-composer-updates-file=/tmp/transient-composer-updates.txt \
            --update-packages-file=/tmp/update-packages.txt \
            --composer-update-flags-file=/tmp/composer-update-flags.txt \
            --expected-lock-file=/tmp/expected-lock.json

          mapfile -t PACKAGES < <(grep -v '^$' /tmp/update-packages.txt || true)
          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No packages to update — refusing to run bare composer update (would upgrade everything)."
            exit 1
          fi

          cp composer.json /tmp/composer.json.orig

          if [ -s /tmp/composer-updates.txt ]; then
            node "$SCRIPTS/update-composer.mjs" \
              --composer-json=composer.json \
              --updates-file=/tmp/composer-updates.txt \
              --changed-output=/tmp/changed.json \
              --working-directory=.
          else
            echo '{}' > /tmp/changed.json
          fi

          if [ -s /tmp/transient-composer-updates.txt ]; then
            node "$SCRIPTS/update-composer.mjs" \
              --composer-json=composer.json \
              --updates-file=/tmp/transient-composer-updates.txt \
              --transient \
              --skip-validate
          fi

          echo "Lock-only update for ${#PACKAGES[@]} package(s): ${PACKAGES[*]}"
          EXTRA_UPDATE_FLAGS=""
          if [ -f /tmp/composer-update-flags.txt ]; then
            EXTRA_UPDATE_FLAGS="$(tr '\n' ' ' < /tmp/composer-update-flags.txt)"
          fi
          composer update "${PACKAGES[@]}" --no-install --no-interaction --no-plugins --no-scripts \
            --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc \
            ${COMPOSER_PLATFORM_UPDATE_FLAGS:-} ${EXTRA_UPDATE_FLAGS}

          cp /tmp/composer.json.orig composer.json
          if [ -s /tmp/composer-updates.txt ]; then
            node "$SCRIPTS/update-composer.mjs" \
              --composer-json=composer.json \
              --updates-file=/tmp/composer-updates.txt \
              --skip-validate
          fi

          if cmp -s composer.json /tmp/composer.json.orig; then
            echo "composer_json_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "composer_json_changed=true" >> "$GITHUB_OUTPUT"
          fi

          VALIDATE_EXTRA=""
          if [ -s /tmp/transient-composer-updates.txt ]; then
            VALIDATE_EXTRA="--no-check-lock"
          fi
          set +e
          composer validate --no-check-publish --no-plugins ${VALIDATE_EXTRA}
          VALIDATE_STATUS=$?
          set -e
          if [ "$VALIDATE_STATUS" -eq 1 ]; then
            echo "::error::composer.json / composer.lock validation failed"
            exit 1
          fi

          node "$SCRIPTS/validate.mjs" --check=locked-versions \
            --composer-json=composer.json \
            --composer-lock=composer.lock \
            --expected-json=/tmp/expected-lock.json

      - name: Format package updates for Slack
        id: updates
        run: |
          set -euo pipefail
          {
            echo "package_updates<<EOF"
            jq -r '.[] | "• `\(.package)` `\(.old)` → `\(.new)`"' /tmp/changes.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit backport changes
        env:
          BACKPORT_VERSION: ${{ steps.meta.outputs.backport_version }}
          BACKPORT_BRANCH: ${{ steps.meta.outputs.backport_branch }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_USER_NAME"
          git config user.email "$BOT_USER_EMAIL"
          git add composer.lock
          if [ "${{ steps.deps.outputs.composer_json_changed }}" = "true" ]; then
            git add composer.json
          fi
          if git diff --cached --quiet; then
            echo "::error::Composer dependency resolution produced no file changes"
            exit 1
          fi
          git commit -m "chore(release): prepare backport ${BACKPORT_VERSION}"
          git push -u origin "$BACKPORT_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate backport release notes
        env:
          GH_TOKEN: ${{ steps.auth.outputs.packages-token }}
          BACKPORT_VERSION: ${{ steps.meta.outputs.backport_version }}
          SOURCE_RELEASE: ${{ steps.meta.outputs.source_release }}
        run: |
          set -euo pipefail
          node "$SCRIPTS/collect-release-notes.mjs" \
            --changes=/tmp/changes.json \
            --platform-version="$BACKPORT_VERSION" \
            --source-release="$SOURCE_RELEASE" \
            --composer-lock=composer.lock \
            --output=/tmp/release-notes.md \
            --summary-output=/tmp/summary.md

      - name: Create tag and GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BACKPORT_VERSION: ${{ steps.meta.outputs.backport_version }}
          BACKPORT_BRANCH: ${{ steps.meta.outputs.backport_branch }}
          SOURCE_RELEASE: ${{ steps.meta.outputs.source_release }}
          SOURCE_INPUT: ${{ inputs.source_release }}
          MARK_AS_LATEST: ${{ steps.meta.outputs.mark_as_latest }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          git tag -a "$BACKPORT_VERSION" "$SHA" -m "Platform backport ${BACKPORT_VERSION}"
          git push origin "refs/tags/${BACKPORT_VERSION}"

          gh release create "$BACKPORT_VERSION" \
            --repo "$GH_REPO" \
            --title "$BACKPORT_VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest="$MARK_AS_LATEST" \
            --target "$SHA"

          URL=$(gh release view "$BACKPORT_VERSION" --repo "$GH_REPO" --json url -q .url)
          echo "release_url=$URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Backport ${BACKPORT_VERSION}"
            echo ""
            echo "- Source input: \`${SOURCE_INPUT}\`"
            echo "- Source release (resolved): \`${SOURCE_RELEASE}\`"
            echo "- Branch: \`${BACKPORT_BRANCH}\`"
            echo "- Tag: \`${BACKPORT_VERSION}\`"
            echo "- GitHub latest: \`${MARK_AS_LATEST}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Release URL: ${URL}"
            echo ""
            cat /tmp/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch follow-up workflows
        if: false
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BACKPORT_VERSION: ${{ steps.meta.outputs.backport_version }}
          DISPATCH_WORKFLOWS: ''
          TOKEN_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set -euo pipefail
          # Tag pushes done with GITHUB_TOKEN do not start other workflows. Always
          # dispatch explicitly when the consumer lists workflow files.
          if [ "$TOKEN_SOURCE" = "fallback" ]; then
            echo "::notice::Tag was pushed with GITHUB_TOKEN (no elevated SEMVER_GH_TOKEN); relying on workflow_dispatch for follow-ups."
          fi
          IFS=',' read -ra WORKFLOWS <<< "$DISPATCH_WORKFLOWS"
          for wf in "${WORKFLOWS[@]}"; do
            wf="$(echo "$wf" | xargs)"
            [ -n "$wf" ] || continue
            echo "Dispatching ${wf} at ref ${BACKPORT_VERSION}"
            gh workflow run "$wf" --repo "$GH_REPO" --ref "$BACKPORT_VERSION"
          done

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: backport
    if: >
      always() &&
      false &&
      needs.backport.result != 'cancelled' &&
      needs.backport.outputs.version != ''
    permissions:
      contents: read
    steps:
      - name: Slack notification
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        env:
          SLACK_NOTIFICATION: 'true'
        with:
          status: ${{ needs.backport.result == 'success' && 'success' || 'failure' }}
          version: ${{ needs.backport.outputs.version }}
          release-url: ${{ needs.backport.outputs.release_url }}
          slack-token: ${{ secrets.SEMVER_SLACK_TOKEN }}
          slack-channel: ${{ secrets.SEMVER_SLACK_CHANNEL }}
          repository: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          message: Backport release
          updates: ${{ needs.backport.outputs.package_updates }}
