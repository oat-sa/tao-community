# Self-contained tao-community workflow (see tao-community/README.md).

name: Platform create RC

on:
  workflow_dispatch:
    inputs:
      release_month:
        description: >
          Optional RC target. Leave blank to auto-calculate. Accepts
          release-YYYY-MM, YYYY.MM, YYYY-MM, or …-lts / LTS.
        required: false
        type: string
        default: ''
      lts:
        description: >
          Force LTS (keyword "YYYY.MM LTS" + release-note marker). Tag stays
          YYYY.MM. When false, LTS is still inferred for Feb/May/Aug/Nov or from
          release_month …-lts.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: platform-create-rc-${{ github.repository }}
  cancel-in-progress: false

env:
  PLATFORM_MAIN_BRANCH: master
  PLATFORM_TAG_PREFIX: ''
  BOT_USER_NAME: oat-github-bot
  BOT_USER_EMAIL: oat-github-bot@taotesting.com

jobs:
  create-rc:
    name: Create RC branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform (caller)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve GitHub token for this repository
        id: auth
        uses: ./.github/actions/resolve-github-token
        with:
          elevated-token: ${{ secrets.SEMVER_GH_TOKEN }}
          fallback-token: ${{ github.token }}

      - name: Load bundled platform-release tooling
        id: tooling
        uses: ./.github/actions/platform-release-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Composer cache
        uses: ./.github/actions/cache-composer

      - name: Setup Composer
        uses: ./.github/actions/setup-composer
        with:
          php-version: '8.3'
          github-token: ${{ steps.auth.outputs.packages-token }}

      - name: Resolve RC base (branch or latest tag)
        id: base
        env:
          MAIN_BRANCH: master
        run: |
          set -euo pipefail
          git fetch --tags --force
          git fetch origin 'refs/heads/*:refs/remotes/origin/*'
          git tag -l > /tmp/tags.txt

          if [ -n "$(echo "${MAIN_BRANCH}" | tr -d '[:space:]')" ] \
            && git show-ref --verify --quiet "refs/remotes/origin/${MAIN_BRANCH}"; then
            git checkout -B "$MAIN_BRANCH" "origin/${MAIN_BRANCH}"
            echo "ref=${MAIN_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "kind=branch" >> "$GITHUB_OUTPUT"
            echo "Using base branch ${MAIN_BRANCH}"
          else
            BASE_TAG=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { pathToFileURL } from "node:url";
              import { dirname, join } from "node:path";
              const lib = join(dirname(process.env.SCRIPTS), "lib", "platform-version.js");
              const PV = await import(pathToFileURL(lib).href);
              const prefix = process.env.PLATFORM_TAG_PREFIX ?? "";
              const tags = readFileSync("/tmp/tags.txt", "utf8").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
              const bare = PV.bareTagsFromList(tags, prefix);
              const latest = PV.latestAnyRelease(bare);
              if (!latest) {
                console.error("::error::No base branch \"" + (process.env.MAIN_BRANCH || "") + "\" and no platform tags found.");
                process.exit(1);
              }
              process.stdout.write(PV.formatTag(latest, prefix));
            ')
            git checkout -B "platform-create-rc-base" "refs/tags/${BASE_TAG}"
            echo "ref=${BASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "kind=tag" >> "$GITHUB_OUTPUT"
            echo "Base branch '${MAIN_BRANCH}' missing; using latest platform tag ${BASE_TAG}"
          fi

      - name: Calculate RC branch
        id: rc
        env:
          RELEASE_MONTH: ${{ inputs.release_month }}
          LTS_INPUT: ${{ inputs.lts }}
        run: |
          set -euo pipefail
          LTS_ARGS=()
          if [ "$LTS_INPUT" = "true" ]; then
            LTS_ARGS+=(--lts=true)
          fi
          node "$SCRIPTS/calculate-next-rc.mjs" \
            --release-month="${RELEASE_MONTH}" \
            --tags-file=/tmp/tags.txt \
            "${LTS_ARGS[@]}"

          RC_BRANCH=$(grep '^rc_branch=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          if git show-ref --verify --quiet "refs/remotes/origin/${RC_BRANCH}" \
            || git show-ref --verify --quiet "refs/heads/${RC_BRANCH}"; then
            echo "::error::RC branch already exists: ${RC_BRANCH}"
            exit 1
          fi

      - name: Resolve and update managed package versions
        id: update
        env:
          # Prefer SEMVER_GH_TOKEN for private oat-sa tag/VCS reads (set by resolve-github-token).
          GH_TOKEN: ${{ steps.auth.outputs.packages-token }}
        run: |
          set -euo pipefail
          node "$SCRIPTS/resolve-latest-versions.mjs" \
            --composer-json=composer.json \
            --working-directory=. \
            --output=/tmp/resolved.json

          node "$SCRIPTS/detect-managed-packages.mjs" --composer-json=composer.json --output=/tmp/managed.json
          mapfile -t PACKAGES < <(jq -r 'keys[]' /tmp/managed.json)
          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No managed packages found — refusing bare composer update."
            exit 1
          fi

          # Lock-only: rewrite constraints, then resolve lock without installing vendor.
          echo "Lock-only update for ${#PACKAGES[@]} managed package(s)"
          node "$SCRIPTS/update-composer.mjs" \
            --composer-json=composer.json \
            --from-resolved=/tmp/resolved.json \
            --skip-validate \
            --changed-output=/tmp/changed.json \
            --working-directory=.

          composer update "${PACKAGES[@]}" --no-install --no-interaction --no-plugins --no-scripts \
            --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc \
            ${COMPOSER_PLATFORM_UPDATE_FLAGS:-}

          # Exact pins are intentional. Composer exits 2 on warnings; fail only on errors (1).
          set +e
          composer validate --no-check-publish
          VALIDATE_STATUS=$?
          set -e
          if [ "$VALIDATE_STATUS" -eq 1 ]; then
            echo "::error::composer.json / composer.lock validation failed"
            exit 1
          fi

          node "$SCRIPTS/validate.mjs" --check=locked-versions \
            --composer-json=composer.json \
            --composer-lock=composer.lock

          CHANGED_COUNT=$(jq 'length' /tmp/changed.json)
          echo "changed_count=${CHANGED_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Update composer keywords with monthly version
        env:
          RC_BRANCH: ${{ steps.rc.outputs.rc_branch }}
          LTS_FLAG: ${{ steps.rc.outputs.lts }}
        run: |
          set -euo pipefail
          node "$SCRIPTS/update-keywords.mjs" \
            --composer-json=composer.json \
            --rc-branch="$RC_BRANCH" \
            --lts="${LTS_FLAG}"

      - name: Create branch, commit, and push
        id: push
        env:
          RC_BRANCH: ${{ steps.rc.outputs.rc_branch }}
          PLATFORM_VERSION: ${{ steps.rc.outputs.platform_version }}
        run: |
          set -euo pipefail
          git config user.name "$BOT_USER_NAME"
          git config user.email "$BOT_USER_EMAIL"
          git checkout -b "$RC_BRANCH"

          git add composer.json composer.lock
          if git diff --cached --quiet; then
            echo "No file changes; pushing RC branch at current base tip."
            git push -u origin "$RC_BRANCH"
          else
            git commit -m "chore(release): prepare ${RC_BRANCH}"
            git push -u origin "$RC_BRANCH"
          fi

          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          {
            echo "## Created RC \`${RC_BRANCH}\`"
            echo ""
            echo "- Platform version: \`${PLATFORM_VERSION}\`"
            echo "- Commit: \`${SHA}\`"
            echo "- Base (${{ steps.base.outputs.kind }}): \`${{ steps.base.outputs.ref }}\`"
            echo ""
            echo "### Package updates"
            echo ""
            if [ -f /tmp/changed.json ] && [ "$(jq 'length' /tmp/changed.json)" != "0" ]; then
              echo "| Package | Old | New |"
              echo "|---|---|---|"
              jq -r 'to_entries[] | "| `\(.key)` | `\(.value.old)` | `\(.value.new)` |"' /tmp/changed.json
            else
              echo "_Managed packages already at latest stable on base._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch follow-up workflows
        if: false
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RC_BRANCH: ${{ steps.rc.outputs.rc_branch }}
          DISPATCH_WORKFLOWS: ''
          TOKEN_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SOURCE" = "fallback" ]; then
            echo "::notice::Branch was pushed with GITHUB_TOKEN (no elevated SEMVER_GH_TOKEN); relying on workflow_dispatch for follow-ups."
          fi
          IFS=',' read -ra WORKFLOWS <<< "$DISPATCH_WORKFLOWS"
          for wf in "${WORKFLOWS[@]}"; do
            wf="$(echo "$wf" | xargs)"
            [ -n "$wf" ] || continue
            echo "Dispatching ${wf} at ref ${RC_BRANCH}"
            gh workflow run "$wf" --repo "$GH_REPO" --ref "$RC_BRANCH"
          done
