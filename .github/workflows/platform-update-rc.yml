# Self-contained tao-community workflow (see tao-community/README.md).

name: Platform update RC

on:
  workflow_dispatch:
    inputs:
      rc_branch:
        description: >
          Optional branch to update (release-YYYY-MM). Leave blank for the latest
          existing release-YYYY-MM branch.
        required: false
        type: string
        default: ''
      extensions:
        description: >
          Optional selective updates (blank = refresh ALL managed packages to
          latest). package=version / URLs; separate with commas or |,
          e.g. oat-sa/tao-core=56.7.3
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: platform-update-rc-${{ inputs.rc_branch || 'latest' }}-${{ github.repository }}
  cancel-in-progress: false

env:
  PLATFORM_MAIN_BRANCH: master
  PLATFORM_TAG_PREFIX: ''
  BOT_USER_NAME: oat-github-bot
  BOT_USER_EMAIL: oat-github-bot@taotesting.com

jobs:
  update-rc:
    name: Update RC branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform (caller)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve GitHub token for this repository
        id: auth
        uses: ./.github/actions/resolve-github-token
        with:
          elevated-token: ${{ secrets.SEMVER_GH_TOKEN }}
          fallback-token: ${{ github.token }}


      - name: Load bundled platform-release tooling
        id: tooling
        uses: ./.github/actions/platform-release-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Composer cache
        uses: ./.github/actions/cache-composer

      - name: Setup Composer
        uses: ./.github/actions/setup-composer
        with:
          php-version: '8.3'
          github-token: ${{ steps.auth.outputs.packages-token }}

      - name: Resolve RC branch
        id: rc
        env:
          RC_INPUT: ${{ inputs.rc_branch }}
          EXTENSIONS: ${{ inputs.extensions }}
        run: |
          set -euo pipefail
          git fetch origin 'refs/heads/*:refs/remotes/origin/*'
          git branch -r | sed 's|^[[:space:]]*origin/||' > /tmp/branches.txt

          node "$SCRIPTS/validate.mjs" --check=latest-rc-branch \
            --branch="${RC_INPUT}" \
            --branches-file=/tmp/branches.txt

          RC_BRANCH=$(grep '^rc_branch=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          git checkout -B "$RC_BRANCH" "origin/${RC_BRANCH}"

          MONTHLY=$(grep '^monthly_base=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2- || true)
          if [ -z "${MONTHLY}" ]; then
            export RC_BRANCH
            MONTHLY=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { pathToFileURL } from "node:url";
              import { dirname, join } from "node:path";
              const lib = join(dirname(process.env.SCRIPTS), "lib", "platform-version.js");
              const { monthlyFromComposer } = await import(pathToFileURL(lib).href);
              const monthly = monthlyFromComposer(JSON.parse(readFileSync("composer.json", "utf8")));
              if (monthly) process.stdout.write(monthly);
            ' || true)
          fi

          if [ -n "$(echo "${EXTENSIONS}" | tr -d '[:space:]')" ]; then
            if [ -z "${MONTHLY}" ]; then
              echo "::error::Selective update needs a monthly line (YYYY.MM). Use release-YYYY-MM or set tao-community to dev-release-YYYY-MM on branch ${RC_BRANCH}."
              exit 1
            fi
            echo "mode=selective" >> "$GITHUB_OUTPUT"
          else
            echo "mode=refresh-all" >> "$GITHUB_OUTPUT"
          fi
          echo "monthly_base=${MONTHLY}" >> "$GITHUB_OUTPUT"

      - name: Selective package updates on RC
        id: selective
        if: steps.rc.outputs.mode == 'selective'
        env:
          EXTENSIONS: ${{ inputs.extensions }}
          SOURCE_MONTHLY: ${{ steps.rc.outputs.monthly_base }}
          GH_TOKEN: ${{ steps.auth.outputs.packages-token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXTENSIONS" > /tmp/updates.txt

          node "$SCRIPTS/resolve-backport-updates.mjs" \
            --composer-json=composer.json \
            --source-monthly="$SOURCE_MONTHLY" \
            --updates-file=/tmp/updates.txt \
            --output=/tmp/changes.json \
            --composer-updates-file=/tmp/composer-updates.txt \
            --transient-composer-updates-file=/tmp/transient-composer-updates.txt \
            --update-packages-file=/tmp/update-packages.txt \
            --expected-lock-file=/tmp/expected-lock.json

          mapfile -t PACKAGES < <(grep -v '^$' /tmp/update-packages.txt || true)
          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No packages to update — refusing bare composer update."
            exit 1
          fi

          cp composer.json /tmp/composer.json.orig

          # Persistent composer.json updates (packages already in require/require-dev).
          if [ -s /tmp/composer-updates.txt ]; then
            node "$SCRIPTS/update-composer.mjs" \
              --composer-json=composer.json \
              --updates-file=/tmp/composer-updates.txt \
              --changed-output=/tmp/changed.json \
              --working-directory=.
          else
            echo '{}' > /tmp/changed.json
          fi

          # Transient root pins for lock resolution only (restored before commit).
          if [ -s /tmp/transient-composer-updates.txt ]; then
            node "$SCRIPTS/update-composer.mjs" \
              --composer-json=composer.json \
              --updates-file=/tmp/transient-composer-updates.txt \
              --transient \
              --skip-validate
          fi

          echo "Lock-only update for ${#PACKAGES[@]} package(s): ${PACKAGES[*]}"
          composer update "${PACKAGES[@]}" --no-install --no-interaction --no-plugins --no-scripts \
            --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc \
            ${COMPOSER_PLATFORM_UPDATE_FLAGS:-}

          cp /tmp/composer.json.orig composer.json
          if [ -s /tmp/composer-updates.txt ]; then
            node "$SCRIPTS/update-composer.mjs" \
              --composer-json=composer.json \
              --updates-file=/tmp/composer-updates.txt \
              --skip-validate
          fi

          if cmp -s composer.json /tmp/composer.json.orig; then
            echo "composer_json_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "composer_json_changed=true" >> "$GITHUB_OUTPUT"
          fi

          VALIDATE_EXTRA=""
          if [ -s /tmp/transient-composer-updates.txt ]; then
            VALIDATE_EXTRA="--no-check-lock"
          fi
          set +e
          composer validate --no-check-publish --no-plugins ${VALIDATE_EXTRA}
          VALIDATE_STATUS=$?
          set -e
          if [ "$VALIDATE_STATUS" -eq 1 ]; then
            echo "::error::composer.json / composer.lock validation failed"
            exit 1
          fi

          node "$SCRIPTS/validate.mjs" --check=locked-versions \
            --composer-json=composer.json \
            --composer-lock=composer.lock \
            --expected-json=/tmp/expected-lock.json

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          cp /tmp/changes.json /tmp/summary-changes.json

      - name: Resolve and update all managed package versions
        id: refresh
        if: steps.rc.outputs.mode == 'refresh-all'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.packages-token }}
        run: |
          set -euo pipefail
          node "$SCRIPTS/resolve-latest-versions.mjs" \
            --composer-json=composer.json \
            --working-directory=. \
            --output=/tmp/resolved.json

          HAS_CHANGES=$(jq -r '.changed | length' /tmp/resolved.json)
          if [ "$HAS_CHANGES" = "0" ]; then
            echo "RC is already current — no extension version changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            {
              echo "## RC already current"
              echo ""
              echo "- Branch: \`${{ steps.rc.outputs.rc_branch }}\`"
              echo "- No managed package updates available."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          node "$SCRIPTS/detect-managed-packages.mjs" --composer-json=composer.json --output=/tmp/managed.json
          mapfile -t PACKAGES < <(jq -r 'keys[]' /tmp/managed.json)
          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No managed packages found — refusing bare composer update."
            exit 1
          fi

          echo "Lock-only update for ${#PACKAGES[@]} managed package(s)"
          node "$SCRIPTS/update-composer.mjs" \
            --composer-json=composer.json \
            --from-resolved=/tmp/resolved.json \
            --skip-validate \
            --changed-output=/tmp/changed.json \
            --working-directory=.

          composer update "${PACKAGES[@]}" --no-install --no-interaction --no-plugins --no-scripts \
            --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc \
            ${COMPOSER_PLATFORM_UPDATE_FLAGS:-}

          set +e
          composer validate --no-check-publish
          VALIDATE_STATUS=$?
          set -e
          if [ "$VALIDATE_STATUS" -eq 1 ]; then
            echo "::error::composer.json / composer.lock validation failed"
            exit 1
          fi

          node "$SCRIPTS/validate.mjs" --check=locked-versions \
            --composer-json=composer.json \
            --composer-lock=composer.lock

          jq -n --slurpfile c /tmp/changed.json '
            $c[0] | to_entries | map({package: .key, old: .value.old, new: .value.new})
          ' > /tmp/summary-changes.json

      - name: Commit and push
        id: push
        if: >
          (steps.rc.outputs.mode == 'selective' && steps.selective.outputs.has_changes == 'true') ||
          (steps.rc.outputs.mode == 'refresh-all' && steps.refresh.outputs.has_changes == 'true')
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RC_BRANCH: ${{ steps.rc.outputs.rc_branch }}
          MODE: ${{ steps.rc.outputs.mode }}
          CREATE_PR: false
        run: |
          set -euo pipefail
          git config user.name "$BOT_USER_NAME"
          git config user.email "$BOT_USER_EMAIL"

          git add composer.lock
          if [ "$MODE" != "selective" ] || [ "${{ steps.selective.outputs.composer_json_changed }}" = "true" ]; then
            git add composer.json
          fi
          if git diff --cached --quiet; then
            echo "RC is already current (lock unchanged)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## RC already current"
              echo ""
              echo "- Branch: \`${RC_BRANCH}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "selective" ]; then
            COMMIT_MSG="chore(release): selective dependency update on ${RC_BRANCH}"
            TITLE="Selective update on RC \`${RC_BRANCH}\`"
          else
            COMMIT_MSG="chore(release): refresh ${RC_BRANCH} dependencies"
            TITLE="Refreshed RC \`${RC_BRANCH}\`"
          fi
          git commit -m "$COMMIT_MSG"

          package_update_table_rows() {
            if [ -f /tmp/summary-changes.json ]; then
              jq -r '
                .[] |
                if .via then
                  "| `\(.package) (via community)` | `\(.old)` | `\(.new)` |"
                else
                  "| `\(.package)` | `\(.old)` | `\(.new)` |"
                end
              ' /tmp/summary-changes.json
            elif [ -f /tmp/changed.json ]; then
              jq -r 'to_entries[] | "| `\(.key)` | `\(.value.old)` | `\(.value.new)` |"' /tmp/changed.json
            fi
          }

          write_rc_pr_body() {
            {
              echo "Auto-generated RC dependency update."
              echo ""
              echo "### Package updates"
              echo ""
              echo "| Package | Old | New |"
              echo "|---|---|---|"
              package_update_table_rows
            } > /tmp/rc-pr-body.md
          }

          push_via_pr() {
            local tmp_branch="tmp-update-rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "::warning::Direct push to ${RC_BRANCH} blocked. Updating via pull request."
            write_rc_pr_body
            git push origin --delete "$tmp_branch" 2>/dev/null || true
            git push origin "HEAD:refs/heads/${tmp_branch}"
            gh pr create \
              --repo "$GH_REPO" \
              --title "$COMMIT_MSG" \
              --body-file /tmp/rc-pr-body.md \
              --base "$RC_BRANCH" \
              --head "$tmp_branch"
            PR_NUMBER=$(gh pr list --repo "$GH_REPO" --head "$tmp_branch" --base "$RC_BRANCH" --json number --jq '.[0].number')
            gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --admin
            git push origin --delete "$tmp_branch" 2>/dev/null || true
            git fetch origin "$RC_BRANCH"
            echo "pull request (--admin)"
          }

          if git push origin "$RC_BRANCH"; then
            PUSH_METHOD="direct push"
            SHA=$(git rev-parse HEAD)
          elif [ "$CREATE_PR" = "true" ]; then
            PUSH_METHOD=$(push_via_pr)
            SHA=$(git rev-parse "origin/${RC_BRANCH}")
          else
            echo "::error::Direct push to ${RC_BRANCH} blocked. Enable create_pr for protected-branch consumers (e.g. ami-luoss)."
            exit 1
          fi

          echo "pushed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## ${TITLE}"
            echo ""
            echo "- Commit: \`${SHA}\`"
            echo "- Mode: \`${MODE}\`"
            echo "- Push: \`${PUSH_METHOD}\`"
            echo ""
            echo "### Package updates"
            echo ""
            echo "| Package | Old | New |"
            echo "|---|---|---|"
            package_update_table_rows
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch follow-up workflows
        if: false && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RC_BRANCH: ${{ steps.rc.outputs.rc_branch }}
          DISPATCH_WORKFLOWS: ''
          TOKEN_SOURCE: ${{ steps.auth.outputs.source }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SOURCE" = "fallback" ]; then
            echo "::notice::Branch was pushed with GITHUB_TOKEN (no elevated SEMVER_GH_TOKEN); relying on workflow_dispatch for follow-ups."
          fi
          IFS=',' read -ra WORKFLOWS <<< "$DISPATCH_WORKFLOWS"
          for wf in "${WORKFLOWS[@]}"; do
            wf="$(echo "$wf" | xargs)"
            [ -n "$wf" ] || continue
            echo "Dispatching ${wf} at ref ${RC_BRANCH}"
            gh workflow run "$wf" --repo "$GH_REPO" --ref "$RC_BRANCH"
          done
